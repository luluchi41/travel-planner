<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5ef"><title>旅途手帳｜互動旅遊規劃</title><style>
:root{--bg:#f6f5ef;--card:#ebe8e3;--ink:#211f1b;--muted:#77736c;--line:#d4d0c8;--gold:#ae721c;--blue:#287d91;--red:#b84b39;--green:#279475}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',Arial,sans-serif;font-size:15px;line-height:1.55}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #71b9c4;outline-offset:2px}.shell{max-width:850px;margin:auto;padding:20px 18px 120px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 20px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:800}.top h1{margin:3px 0;font-size:25px;letter-spacing:1px}.sub{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.outline,.tab,.chip{border:1px solid #a9a59d;background:transparent;color:#34312c;padding:10px 13px;font-weight:700}.outline:hover,.tab:hover,.chip:hover{background:#e7e2da}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}.tab.active,.chip.active{background:#201d19;color:white;border-color:#201d19}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 28px}.day{padding:11px 2px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0}.section-head h2{font-size:20px;margin:0}.progress{height:7px;background:#dedbd4;border-radius:10px;overflow:hidden;margin:10px 0 20px}.progress span{display:block;height:100%;background:#369c78;transition:width .2s}.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}.chip{white-space:nowrap;padding:7px 11px;font-size:13px}.item{background:var(--card);margin:13px 0;border-left:5px solid var(--gold);padding:16px 17px}.item.blue{border-color:#478ac7}.item.pink{border-color:#c9507a}.item.green{border-color:#339d7d}.itemhead{display:flex;align-items:center;gap:10px}.itemhead strong{flex:1;font-size:16px}.itemhead input{width:22px;height:22px;accent-color:#319f77}.status{font-size:12px;font-weight:700;background:#f7f6f1;border:1px solid #ddd8d0;border-radius:20px;padding:2px 9px;white-space:nowrap}.status.ok{color:#16815d}.status.wait{color:#bd3151}.expand{border:0;background:transparent;font-size:18px;padding:3px}.detail{border-top:1px solid #d5d0c8;margin-top:13px;padding-top:12px;color:#59564f}.detail p{margin:6px 0}.timeline{display:grid;gap:15px}.stop{background:var(--card);border-left:5px solid var(--blue);padding:18px 17px}.stop.food{border-color:var(--red)}.stop h3{margin:0;font-size:20px}.time{color:#a4691a;font-weight:800;font-size:18px}.until{font-size:13px;color:var(--muted)}.stop-title{display:grid;grid-template-columns:115px 1fr;gap:8px;align-items:start}.pills{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.pill{background:#d9e7e5;color:#317784;padding:4px 9px;font-size:12px;font-weight:800}.pill.food{background:#eed6ce;color:#a04435}.info{margin:10px 0}.route{border:1px solid #d4cfc6;border-radius:9px;background:#f7f6f1;padding:12px 15px;margin-top:12px}.route p{margin:7px 0}.travel{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 0 28px;padding:7px 0 7px 20px;border-left:3px dashed #b1ada6;color:#494640}.black{background:#1d1a17;color:white;border:0;border-radius:25px;padding:8px 14px;font-weight:700;white-space:nowrap}.bottom{position:fixed;bottom:0;left:0;right:0;background:#f6f5ef;border-top:1px solid #bdb8af;display:flex;justify-content:center;gap:min(12vw,110px);padding:10px 15px calc(12px + env(safe-area-inset-bottom));z-index:5}.nav{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;min-width:65px;font-weight:700;color:#4e4a43}.nav .emoji{font-size:25px}.nav.active{color:#ad721d}.hidden{display:none!important}.empty{padding:35px;text-align:center;color:#777}.editor{display:grid;gap:12px;background:#eae7e0;padding:17px;margin-top:15px}.field{display:grid;gap:4px;font-weight:700;font-size:13px}.field input,.field textarea,.field select{border:1px solid #c6c0b5;border-radius:3px;padding:11px;background:#fff}.field textarea{min-height:80px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.danger{color:#b33535}.small{font-size:12px;color:var(--muted)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.footer{color:#8c877d;font-size:12px;text-align:center;margin:40px 0}.tag{border:1px solid #ad721d;border-radius:25px;padding:3px 9px;font-size:12px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#24201d;color:white;padding:9px 17px;border-radius:25px;display:none;z-index:10} @media(max-width:520px){.shell{padding:12px 13px 115px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:22px}.outline{padding:8px 11px}.stop-title{grid-template-columns:100px 1fr}.stop h3{font-size:18px}.item{padding:13px 11px}.status{font-size:11px;padding:2px 6px}.days{gap:6px}.tab{padding:10px 2px;font-size:13px}}@media print{.bottom,.actions,.tabs,.days,.filters,.tools,.expand,.editor,.black,.nav,.no-print{display:none!important}.shell{max-width:100%;padding:0}.stop,.item{break-inside:avoid}.hidden{display:block!important}body{background:white}}
</style></head><body><main class="shell"><header class="top"><div><div class="eyebrow">MY TRAVEL JOURNAL</div><h1 id="tripTitle">韓國旅行手帳</h1><div class="sub">自己的旅程，自己安排 · 自動儲存於此裝置</div></div><div class="actions"><button class="outline" id="copyBtn">複製行程</button><button class="outline" id="pdfBtn">存成 PDF</button></div></header><div id="page"></div><div class="footer">TRAVEL JOURNAL · Made for your next adventure</div></main><nav class="bottom"><button class="nav" data-nav="checklist"><span class="emoji">✅</span>清單</button><button class="nav" data-nav="activities"><span class="emoji">🎟️</span>活動</button><button class="nav" data-nav="itinerary"><span class="emoji">📅</span>行程</button></nav><div class="toast" id="toast" role="status"></div><script>
const sample={title:'韓國旅行手帳',days:7,stops:[{id:'s1',day:1,start:'17:00',end:'18:00',name:'駁二藝術特區',type:'景點',hours:'10:00–18:00',notes:'停留 1 小時，欣賞藝術裝置與港邊風景',route:'高雄國際機場 → 美麗島（紅線）→ 鹽埕埔（橘線）',cost:'TWD 35',map:'高雄駁二藝術特區',travel:'步行約 10 分鐘至永心浮島'},{id:'s2',day:1,start:'18:30',end:'20:30',name:'永心浮島 YONSHIN FUDOPIA',type:'美食',hours:'12:00–23:00',notes:'推薦：碳烤生章魚腳、台式青醬牡蠣炒麵、酥炸銀魚。用餐約 120 分鐘',route:'從駁二藝術特區步行前往',cost:'',map:'永心浮島 高雄',travel:''},{id:'s3',day:2,start:'10:00',end:'11:30',name:'特色咖啡廳',type:'美食',hours:'09:00–19:00',notes:'享受早午餐，拍照留念',route:'搭乘大眾運輸前往',cost:'',map:'高雄 咖啡廳',travel:''}],activities:[{id:'a1',name:'Compose Coffee',category:'咖啡廳',date:'',reservation:'',notes:'旅行期間想去的咖啡廳',done:false},{id:'a2',name:'田柾國公車看板',category:'廣告',date:'',reservation:'',notes:'粉絲應援打卡',done:false},{id:'a3',name:'JIMIN 公車看板',category:'廣告',date:'',reservation:'',notes:'粉絲應援打卡',done:false},{id:'a4',name:'Lador',category:'快閃店',date:'',reservation:'',notes:'期間限定活動',done:false},{id:'a5',name:'防彈應援咖啡廳',category:'咖啡廳',date:'',reservation:'未預約',notes:'請確認預約資訊',done:false},{id:'a6',name:'LOVE QUEST 展覽',category:'展覽',date:'',reservation:'未預約',notes:'請確認展覽開放時間',done:false}]};
const key='travel-journal-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||structuredClone(sample)}catch{data=structuredClone(sample)}let view='itinerary',day=1,filter='全部',opened=null,editing=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch{}},notify=s=>{let el=$('#toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2300)},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);function render(){document.title=data.title+'｜旅途手帳';$('#tripTitle').textContent=data.title;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));$('#page').innerHTML=view==='itinerary'?itinerary():view==='activities'?activities():checklist();bind()}
function itinerary(){let d=data.stops.filter(s=>day===0||s.day===day).sort((a,b)=>a.day-b.day||a.start.localeCompare(b.start));return `<div class="days"><button class="tab ${day===0?'active':''}" data-day="0">全部</button>${Array.from({length:data.days},(_,i)=>`<button class="tab day ${day===i+1?'active':''}" data-day="${i+1}">Day ${i+1}</button>`).join('')}</div><div class="section-head"><h2>${day?'Day '+day+' 行程':'所有行程'}</h2><button class="outline" data-action="add-stop">＋ 新增行程</button></div><div class="timeline">${d.length?d.map(s=>`<div><article class="stop ${s.type==='美食'?'food':''}"><div class="stop-title"><div><div class="time">${esc(s.start)}</div><div class="until">– ${esc(s.end)}</div></div><h3>${esc(s.name)}</h3></div><div class="pills"><span class="pill ${s.type==='美食'?'food':''}">${esc(s.type)}</span><span class="small">◷ ${esc(s.hours||'營業時間未填')}</span></div>${s.notes?`<div class="info">📝 ${esc(s.notes)}</div>`:''}${s.cost?`<div class="info">🚇 車資約 ${esc(s.cost)}</div>`:''}${s.route?`<div class="route">🚆 <b>交通方式</b><p>${esc(s.route)}</p></div>`:''}<div class="tools"><button class="outline" data-action="edit-stop" data-id="${s.id}">編輯</button><button class="outline danger" data-action="delete-stop" data-id="${s.id}">刪除</button><button class="black" data-action="map" data-map="${esc(s.map||s.name)}">🧭 導航</button></div></article>${s.travel?`<div class="travel">🚶 ${esc(s.travel)}</div>`:''}</div>`).join(''):'<div class="empty">這一天還沒有行程，點選「新增行程」開始安排。</div>'}</div>${editing?stopForm():''}`}
function activities(){let categories=['全部','咖啡廳','廣告','快閃店','展覽','其他'],arr=data.activities.filter(a=>filter==='全部'||a.category===filter);return `<div class="section-head"><h2>應援打卡點 <span style="color:#ac711c">${data.activities.filter(a=>a.done).length} / ${data.activities.length}</span></h2><button class="outline" data-action="add-activity">＋ 新增</button></div><div class="progress"><span style="width:${data.activities.length?100*data.activities.filter(a=>a.done).length/data.activities.length:0}%"></span></div><div class="filters">${categories.map(c=>`<button class="chip ${filter===c?'active':''}" data-filter="${c}">${c}</button>`).join('')}</div>${arr.map(a=>activityCard(a)).join('')||'<div class="empty">目前沒有這個分類的活動。</div>'}${editing?activityForm():''}`}
function activityCard(a){let cls={'廣告':'blue','快閃店':'pink','展覽':'green'}[a.category]||'',open=opened===a.id;return `<article class="item ${cls}"><div class="itemhead"><input type="checkbox" aria-label="完成 ${esc(a.name)}" data-check="${a.id}" ${a.done?'checked':''}><strong>${esc(a.name)}</strong><span class="status ${a.done?'ok':'wait'}">● ${a.done?'已完成':'未開始'}</span><button class="expand" aria-label="展開詳情" data-expand="${a.id}">${open?'▾':'▸'}</button></div>${open?`<div class="detail"><p>🏷️ ${esc(a.category)}</p><p>📅 ${esc(a.date||'日期未設定')}</p><p>🎟️ ${esc(a.reservation||'預約資訊未設定')}</p><p>📝 ${esc(a.notes||'尚無備註')}</p><div class="tools"><button class="outline" data-action="edit-activity" data-id="${a.id}">編輯</button><button class="outline danger" data-action="delete-activity" data-id="${a.id}">刪除</button></div></div>`:''}</article>`}
function checklist(){let total=data.activities.length,done=data.activities.filter(a=>a.done).length;return `<div class="section-head"><h2>旅行待辦清單</h2><button class="outline" data-action="settings">⚙️ 旅程設定</button></div><div class="item green"><b>打卡完成度　${done} / ${total}</b><div class="progress"><span style="width:${total?done/total*100:0}%"></span></div><div class="small">打卡紀錄會儲存在目前瀏覽器。</div></div><div class="section-head"><h2>所有打卡項目</h2><button class="outline" data-action="add-activity">＋ 新增</button></div>${data.activities.map(a=>`<article class="item"><div class="itemhead"><input type="checkbox" data-check="${a.id}" aria-label="完成 ${esc(a.name)}" ${a.done?'checked':''}><strong style="${a.done?'text-decoration:line-through;color:#8b867e':''}">${esc(a.name)}</strong><span class="small">${esc(a.category)}</span></div></article>`).join('')}${editing?activityForm():''}`}
function stopForm(){let s=data.stops.find(x=>x.id===editing)||{day:day||1,start:'09:00',end:'10:00',type:'景點'};return `<form class="editor" id="stopForm"><h3>${s.id?'編輯':'新增'}行程</h3><label class="field">景點／餐廳名稱<input name="name" required value="${esc(s.name)}"></label><div class="formgrid"><label class="field">日期<select name="day">${Array.from({length:data.days},(_,i)=>`<option value="${i+1}" ${s.day===i+1?'selected':''}>Day ${i+1}</option>`).join('')}</select></label><label class="field">分類<select name="type"><option ${s.type==='景點'?'selected':''}>景點</option><option ${s.type==='美食'?'selected':''}>美食</option><option ${s.type==='其他'?'selected':''}>其他</option></select></label><label class="field">開始<input name="start" type="time" required value="${esc(s.start)}"></label><label class="field">結束<input name="end" type="time" required value="${esc(s.end)}"></label></div><label class="field">營業時間<input name="hours" value="${esc(s.hours)}"></label><label class="field">交通路線<input name="route" value="${esc(s.route)}"></label><label class="field">車資<input name="cost" value="${esc(s.cost)}"></label><label class="field">導航搜尋地點<input name="map" value="${esc(s.map)}"></label><label class="field">下一站交通資訊<input name="travel" value="${esc(s.travel)}"></label><label class="field">備註<textarea name="notes">${esc(s.notes)}</textarea></label><div class="tools"><button class="black" type="submit">儲存行程</button><button class="outline" type="button" data-action="cancel">取消</button></div></form>`}
function activityForm(){let a=data.activities.find(x=>x.id===editing)||{category:'咖啡廳'};return `<form class="editor" id="activityForm"><h3>${a.id?'編輯':'新增'}打卡活動</h3><label class="field">活動名稱<input name="name" required value="${esc(a.name)}"></label><label class="field">分類<select name="category">${['咖啡廳','廣告','快閃店','展覽','其他'].map(c=>`<option ${a.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">日期／活動期間<input name="date" placeholder="例如：2026/11/19" value="${esc(a.date)}"></label><label class="field">預約狀態<input name="reservation" placeholder="例如：已預約 10:00" value="${esc(a.reservation)}"></label><label class="field">備註<textarea name="notes">${esc(a.notes)}</textarea></label><div class="tools"><button class="black" type="submit">儲存活動</button><button class="outline" type="button" data-action="cancel">取消</button></div></form>`}
function settingsForm(){return `<form class="editor" id="settingsForm"><h3>旅程設定</h3><label class="field">旅程名稱<input name="title" required value="${esc(data.title)}"></label><label class="field">旅行天數<input name="days" type="number" min="1" max="30" required value="${data.days}"></label><div class="tools"><button class="black" type="submit">儲存設定</button><button class="outline" type="button" data-action="cancel">取消</button><button class="outline danger" type="button" data-action="reset">恢復範例資料</button></div></form>`}
function bind(){document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=Number(b.dataset.day);editing=false;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{let a=data.activities.find(x=>x.id===b.dataset.check);a.done=b.checked;save();render()});document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{opened=opened===b.dataset.expand?null:b.dataset.expand;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b));for(let kind of ['stop','activity','settings']){let f=$('#'+kind+'Form');if(f){f.onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(f));if(kind==='settings'){data.title=v.title;data.days=Math.max(1,Math.min(30,Number(v.days)));day=Math.min(day,data.days)}else{let arr=kind==='stop'?data.stops:data.activities,old=arr.find(x=>x.id===editing);if(kind==='stop')v.day=Number(v.day);if(old)Object.assign(old,v);else arr.push({...v,id:uid(),...(kind==='activity'?{done:false}:{})})}editing=false;save();render();notify('已儲存')}}}}
function action(b){let a=b.dataset.action,id=b.dataset.id;if(a==='map'){window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(b.dataset.map),'_blank','noopener');return}if(a==='cancel'){editing=false;render();return}if(a==='reset'){if(confirm('確定清除目前所有編輯與打卡紀錄，恢復範例資料？')){data=structuredClone(sample);editing=false;save();render()}return}if(a==='delete-stop'||a==='delete-activity'){if(confirm('確定刪除此項目？')){let k=a==='delete-stop'?'stops':'activities';data[k]=data[k].filter(x=>x.id!==id);save();render()}return}if(a==='settings'){editing='settings';render();$('#page').insertAdjacentHTML('beforeend',settingsForm());bind();document.querySelector('.editor')?.scrollIntoView({behavior:'smooth'});return}editing=id||true;render();document.querySelector('.editor')?.scrollIntoView({behavior:'smooth'})}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;editing=false;render();window.scrollTo({top:0,behavior:'smooth'})});$('#pdfBtn').onclick=()=>window.print();$('#copyBtn').onclick=async()=>{let txt=data.title+'\n\n'+data.stops.slice().sort((a,b)=>a.day-b.day||a.start.localeCompare(b.start)).map(s=>`Day ${s.day} ${s.start}–${s.end} ${s.name}\n${s.notes||''}\n${s.route||''}`).join('\n\n');try{await navigator.clipboard.writeText(txt);notify('行程已複製')}catch{notify('無法複製，請檢查瀏覽器權限')}};render();
</script></body></html>
