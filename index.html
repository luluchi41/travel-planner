<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
        <meta content="#f6f5ef" name="theme-color"/>
        <title>旅途手帳｜互動旅遊規劃</title>
        <link href="style.css" rel="stylesheet"/>
    </head>
    <body>
        <main class="shell">
            <header class="top">
                <div>
                    <div class="eyebrow">MY TRAVEL JOURNAL</div>
                    <h1 id="tripTitle">德國旅行手帳</h1>
                    <div class="sub">自己的旅程，自己安排 &middot; 自動儲存於此裝置</div>
                </div>
                <div class="actions">
                    <button class="outline" id="copyBtn">複製行程</button>
                    <button class="outline" id="exportJsonBtn" type="button">匯出 JSON</button>
                    <button class="outline" id="importJsonBtn" type="button">匯入 JSON</button>
                    <input id="importJsonFile" type="file" accept=".json,application/json" hidden aria-label="選擇旅程 JSON 檔案"/>
                    <button class="outline" id="pdfBtn">存成 PDF</button>
                </div>
            </header>
            <div id="page"></div>
            <div class="footer">TRAVEL JOURNAL &middot; Made for your next adventure</div>
        </main>
        <nav class="bottom">
            <button class="nav" data-nav="checklist"><span class="emoji">✅</span>清單</button>
            <button class="nav" data-nav="activities"><span class="emoji">🎟️</span>活動</button>
            <button class="nav" data-nav="itinerary"><span class="emoji">📅</span>行程</button>
        </nav>
        <div class="toast" id="toast" role="status">
        </div>
    <script src="js/state.js"></script>
    <script src="js/render.js"></script>
    <script src="js/itinerary.js"></script>
    <script src="js/activities.js"></script>
    <script src="js/activityCard.js"></script>
    <script src="js/checklist.js"></script>
    <script src="js/stopForm.js"></script>
    <script src="js/activityForm.js"></script>
    <script src="js/settingsForm.js"></script>
    <script src="js/bind.js"></script>
    <script src="js/action.js"></script>
    <script src="js/exportJson.js"></script>
    <script src="js/importJson.js"></script>
    <script src="js/init.js"></script>
    </body>
</html>
